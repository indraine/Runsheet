<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#f8fafc" />
        <script>
            ;(function () {
                var schemes = {
                    light: "light",
                    dark: "dark",
                    darcula: "dark",
                    dracula: "dark",
                    monokai: "dark",
                    nord: "dark",
                    mocha: "dark",
                    gruvbox: "dark",
                    "one-dark": "dark",
                    "solarized-dark": "dark",
                    "solarized-light": "light",
                }
                var preference = "light"
                try {
                    var stored = localStorage.getItem("runsheet.theme")
                    if (stored === "system" || schemes[stored])
                        preference = stored
                } catch (e) {}
                var resolved = preference
                var scheme = "light"
                if (preference === "system") {
                    resolved = matchMedia("(prefers-color-scheme: dark)")
                        .matches
                        ? "dark"
                        : "light"
                    scheme = resolved
                } else {
                    scheme = schemes[preference]
                }
                document.documentElement.dataset.theme = resolved
                document.documentElement.style.colorScheme = scheme
                var scale = 100
                try {
                    var raw = Number(localStorage.getItem("runsheet.scale"))
                    if (raw >= 80 && raw <= 150 && Math.round(raw) === raw)
                        scale = raw
                } catch (e) {}
                if (scale !== 100) {
                    var zoom = scale / 100
                    var root = document.documentElement
                    root.style.zoom = String(zoom)
                    root.style.width = 100 / zoom + "vw"
                    root.style.height = 100 / zoom + "dvh"
                }
            })()
        </script>
        <link rel="icon" type="image/svg+xml" href="/src/assets/icon.svg" />
        <title>Runsheet</title>
    </head>

    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>

        <script src="/src/index.tsx" type="module"></script>
    </body>
</html>
