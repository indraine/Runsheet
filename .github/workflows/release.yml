name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    timeout-minutes: 90
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        timeout-minutes: 10
        run: npm install

      - name: Build and publish MSI to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Runsheet v__VERSION__'
          releaseDraft: false
          prerelease: false
          releaseBody: |
            ## Runsheet v1.5.1 — Presence & Outlaps 🏁

            Desktop session sheet for **Assetto Corsa Competizione**.
            Open the app, drive — sessions, laps, sectors, fuel, and validity are captured automatically.

            ### What's new in 1.5.1

            #### Car Presence 📍
            - Status now distinguishes garage, pit lane, and the race grid

            #### Outlaps ⏱️
            - Outlap is recorded as a regular lap
            - Outlap time and sectors are shown live while driving

            #### Race Fixes 🏎️
            - Laps after crossing the finish line in a race are no longer counted

            #### Interface ✨
            - Brand icons for cars
            - Fixed track map in the Live card

            #### Maintenance 🔧
            - Code cleanup, removed one-off scripts

            ### Download (Windows x64) — pick one
            | File | What it is |
            |------|------------|
            | `Runsheet-*-windows-x64-portable.exe` | **Portable app** — download and run, no install |
            | `Runsheet-*-windows-x64-installer.msi` | **Installer** — installs via Windows Installer |

            > Live ACC Shared Memory requires Windows. See the [README](https://github.com/indraine/Runsheet#readme) for details.

            **Full Changelog**: https://github.com/indraine/Runsheet/compare/v1.5.0...v1.5.1
          tauriScript: npm run tauri
          assetNamePattern: 'Runsheet-[version]-windows-[arch]-installer[ext]'

      - name: Upload portable executable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $src = "src-tauri/target/release/runsheet.exe"
          if (-not (Test-Path $src)) {
            throw "Portable binary not found at $src"
          }
          $dst = "Runsheet-$version-windows-x64-portable.exe"
          Copy-Item -Path $src -Destination $dst -Force
          gh release upload "${{ github.ref_name }}" $dst --clobber
