# Builds Windows MSI + portable .exe and publishes a GitHub Release on version tags.
# macOS/Linux are omitted: ACC Shared Memory (live telemetry) is Windows-only.
#
# CI uses npm (not Bun): bun install frequently hangs on windows-latest runners.
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    timeout-minutes: 90
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        timeout-minutes: 10
        run: npm install

      # MSI only (no NSIS *-setup.exe — easy to confuse with the portable app).
      - name: Build and publish MSI to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Runsheet v__VERSION__'
          releaseBody: |
            ## Runsheet v1.3.1 — Home layout, fonts & live card polish 🏁

            Desktop session sheet for **Assetto Corsa Competizione**.
            Open the app, drive — sessions, laps, sectors, fuel, and validity are captured automatically.

            ### What's new in 1.3.1
            - **Resizable home layout** — the session table on the left, tracks and the live card on the right, with a drag handle and a button to expand either pane; a new session restores the 50/50 split and shows the live card
            - **Click a row to open its live card** — a second click closes it and returns the track list
            - **Live card redesign** — track map beside the stat tiles, a laps tile, red cross for laps that do not count, sized by its container
            - **Inter for the interface** — mono font only for numbers; proper Cyrillic everywhere
            - **Auto scale** — the interface follows the window width, up to 200%
            - **Language switch on the welcome page**
            - **Track sorting by the shown name** in the alphabet of the interface language
            - **Race grid and ESC pause statuses**, off-by-one lap time fix, car state reset on game exit
            - **Selectable session table columns**, adaptive tabs and a one-row toolbar

            ### Also included
            - Two-lap telemetry comparison with divergence detection
            - Automatic session / lap / sector (S1–S3) tracking with fuel and validity
            - Catalog of **25 ACC tracks** (Recent, Popular, A–Z; personal bests & attempt counts)
            - Session journal grouped by day and type (Practice, Qualifying, Race / Solo, Online)
            - Appearance themes + multilingual UI (EN / RU)

            ### Download (Windows x64) — pick one
            | File | What it is |
            |------|------------|
            | `Runsheet-*-windows-x64-portable.exe` | **Portable app** — download and run, no install |
            | `Runsheet-*-windows-x64-installer.msi` | **Installer** — installs via Windows Installer |

            > Live ACC Shared Memory requires Windows. See the [README](https://github.com/indraine/Runsheet#readme) for details.
          releaseDraft: false
          prerelease: false
          # Avoid "npm run tauri -- … -- …" — the extra "--" leaks into cargo.
          # MSI-only is already set via bundle.targets in tauri.conf.json.
          tauriScript: npm run tauri
          assetNamePattern: 'Runsheet-[version]-windows-[arch]-installer[ext]'

      - name: Upload portable executable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $src = "src-tauri/target/release/runsheet.exe"
          if (-not (Test-Path $src)) {
            throw "Portable binary not found at $src"
          }
          $dst = "Runsheet-$version-windows-x64-portable.exe"
          Copy-Item -Path $src -Destination $dst -Force
          gh release upload "${{ github.ref_name }}" $dst --clobber
